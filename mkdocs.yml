site_name: "Thermoplastic Welding Process Reference"
site_url: https://kubota-thermoplastic-reference.readthedocs.io/
site_description: "Thermoplastic Welding Process Reference: compiled from public-domain US federal government publications."
site_author: "Kubota Research Archive"
copyright: "Compiled from public-domain US federal government publications."

docs_dir: docs

theme:
  name: material
  features:
    - navigation.top
  palette:
    - scheme: default
      primary: indigo

nav:
  - Reference: index.md

markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3

extra:
  generator: false
